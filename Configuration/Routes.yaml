-
  name:  'Agent Refresh Token API'
  uriPattern: 'neosidekick/api/agentic/refresh-token'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'AgentRefreshTokenApi'
    '@action':     'refresh'
    '@format':     'json'
  httpMethods: ['POST']

-
  name:  'Agent Revoke Refresh Token API'
  uriPattern: 'neosidekick/api/agentic/revoke-refresh-token'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'AgentRevokeRefreshTokenApi'
    '@action':     'revoke'
    '@format':     'json'
  httpMethods: ['POST']

# POST deliberately (not GET): Flow's SecurityEntryPointMiddleware stores only safe
# requests (GET) as the intercepted request for after-login redirects - a
# session-authenticated GET here would poison the editor's next login into redirecting
# to this JSON response when the backend session had expired.
-
  name:  'Agent Embed Token API'
  uriPattern: 'neosidekick/api/agentic/embed-token'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'AgentEmbedTokenApi'
    '@action':     'issue'
    '@format':     'json'
  httpMethods: ['POST']

-
  name:  'Public Preview Render'
  uriPattern: 'neosidekick/preview'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'PreviewRender'
    '@action':     'index'
    '@format':     'html'
  httpMethods: ['GET']

-
  name: 'NEOSidekick Agent Authorization Redirect'
  uriPattern: 'neosidekick/agent/redirect-to-request-authorization'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'AuthorizationRedirect'
    '@action':     'index'
    '@format':     'html'
  httpMethods: ['GET']

-
  name: 'Agent Authorization Page'
  uriPattern: 'neosidekick/agent/request-authorization'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'Agent'
    '@action':     'index'
    '@format':     'html'
  httpMethods: ['GET']
  # After Flow's login interception the LoginController rebuilds this URL through the
  # router, so the query arguments (state, consumer, client_name, redirect_host) must be
  # allowed to ride along - without this the not-logged-in first run ends in a 404.
  appendExceedingArguments: true

-
  name: 'Agent Authorization Action (JSON)'
  uriPattern: 'neosidekick/agent/do-authorize.json'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'Agent'
    '@action':     'authorize'
    '@format':     'json'
  httpMethods: ['POST']

-
  name: 'Agent Authorization Action'
  uriPattern: 'neosidekick/agent/do-authorize'
  defaults:
    '@package':    'NEOSidekick.AiAssistant'
    '@controller': 'Agent'
    '@action':     'authorize'
    '@format':     'html'
  httpMethods: ['POST']
