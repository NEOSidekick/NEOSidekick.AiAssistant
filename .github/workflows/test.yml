name: build

on:
  push:
    branches:
      - 'main'
      - 'feature/neos9-compatibility'
  pull_request:
    branches:
      - 'main'

jobs:
  test:
    name: "Test (PHP ${{ matrix.php-versions }}, Neos ${{ matrix.neos-versions }})"

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4']
        neos-versions: ['9.0', '9.1']
        dependencies: ['locked']
    runs-on: ubuntu-latest

    # The Neos 9 content graph requires MariaDB/MySQL — the functional tests cannot run
    # on the base distribution's SQLite Testing default anymore. Same setup as
    # neos/neos-development-collection's build.yml (MariaDB baseline + Testing settings
    # written in a dedicated step below).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: flow_functional_testing
          MYSQL_ROOT_PASSWORD: neos
        ports:
          - '3306:3306'
        options: --health-cmd="mariadb-admin ping -pneos" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      FLOW_CONTEXT: Testing
      NEOS_FOLDER: neos/
      DIST_FOLDER: DistributionPackages/NEOSidekick.AiAssistant

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xml, json, zlib, iconv, intl, mysql, pgsql, redis, memcached, memcache, apcu
          ini-values: date.timezone="Africa/Tunis", opcache.fast_shutdown=0, apc.enable_cli=on

      - name: Install Neos Project and other dependencies
        run: |
          composer create --no-scripts --no-install neos/neos-base-distribution "${{ env.NEOS_FOLDER }}" "~${{ matrix.neos-versions }}.0"
          cd "${{ env.NEOS_FOLDER }}"
          composer require fakerphp/faker "^1.23.0" --no-install --dev
          composer require phpstan/phpstan "^1.10.0" "composer/pcre:<3.4" --no-install --dev --with-all-dependencies
          composer require squizlabs/php_codesniffer "^3.7" --no-install --dev
          composer require mockery/mockery "@stable" --no-install --dev
          composer config --no-plugins allow-plugins.neos/composer-plugin true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.NEOS_FOLDER }}${{ env.DIST_FOLDER }}

      - name: Finish composer setup
        run: |
          cd "${{ env.NEOS_FOLDER }}"
          composer config repositories.aiassistant '{ "type": "path", "url": "./${{ env.DIST_FOLDER }}", "options": { "symlink": false } }'
          composer require neosidekick/ai-assistant "@dev" --no-install

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/${{ env.NEOS_FOLDER }}Packages
          key: php-${{ matrix.php-versions }}-neos-${{ matrix.neos-versions }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: php-${{ matrix.php-versions }}-neos-${{ matrix.neos-versions }}-${{ matrix.dependencies }}

      - name: Install dependencies
        run: |
          cd ${{ env.NEOS_FOLDER }}
          composer ${{ matrix.dependencies == 'locked' && 'install' || 'update' }} --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Set Flow Context
        run: echo "FLOW_CONTEXT=${{ env.FLOW_CONTEXT }}" >> $GITHUB_ENV

      # The base distribution ships a SQLite Testing configuration; point the Testing
      # context at the MariaDB service instead (the plugin's own Configuration/Testing
      # contributes the rest: catch-up hook disabling, reflection excludes, uriPathSuffix).
      - name: Configure Testing database
        run: |
          cat > "${{ env.NEOS_FOLDER }}Configuration/Testing/Settings.yaml" <<EOF
          Neos:
            Flow:
              persistence:
                backendOptions:
                  driver: pdo_mysql
                  charset: utf8mb4
                  host: '127.0.0.1'
                  port: 3306
                  user: 'neos'
                  password: 'neos'
                  dbname: 'flow_functional_testing'
          EOF

      - name: Run style tests
        run: |
          cd "${{ env.NEOS_FOLDER }}"
          bin/phpcs --colors -n --standard=PSR12 ${{ env.DIST_FOLDER }}/Classes

      - name: Run stan tests
        run: |
          cd "${{ env.NEOS_FOLDER }}"
          bin/phpstan analyse ${{ env.DIST_FOLDER }}/Classes

      - name: Run functional tests
        run: |
          cd "${{ env.NEOS_FOLDER }}"
          bin/phpunit --colors --stop-on-failure -c ${{ env.DIST_FOLDER }}/Tests/FunctionalTests.xml --testsuite "NEOSidekick.AiAssistant" --verbose
