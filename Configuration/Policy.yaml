privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'NEOSidekick.AiAssistant:AuthorizationRedirect':
      label: 'Public NEOSidekick authorization redirect'
      matcher: 'within(NEOSidekick\AiAssistant\Controller\AuthorizationRedirectController)'
    'NEOSidekick.AiAssistant:PublicPreviewRender':
      label: 'Public preview rendering, protected by a signed HMAC token instead of authentication'
      matcher: 'method(NEOSidekick\AiAssistant\Controller\PreviewRenderController->indexAction())'
    'NEOSidekick.AiAssistant:CanUse':
      label: 'NEOSidekick.AiAssistant:Main:privilege.canUse'
      matcher: 'within(NEOSidekick\AiAssistant\Controller\BackendServiceController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\OverviewController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\ImageAlternativeTextController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\FocusKeywordController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\SeoTitleAndMetaDescriptionController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\SeoImageAlternativeTextController) || within(NEOSidekick\AiAssistant\Controller\BackendModule\ConfigurationController) || within(NEOSidekick\AiAssistant\Controller\AgentController) || within(NEOSidekick\AiAssistant\Controller\NodeTypeSchemaApiController) || within(NEOSidekick\AiAssistant\Controller\NodeTreeSchemaApiController) || within(NEOSidekick\AiAssistant\Controller\DocumentNodeListApiController) || within(NEOSidekick\AiAssistant\Controller\SearchNodesApiController) || within(NEOSidekick\AiAssistant\Controller\SearchMediaAssetsApiController) || within(NEOSidekick\AiAssistant\Controller\UploadMediaAssetApiController) || within(NEOSidekick\AiAssistant\Controller\ApplyPatchesApiController) || within(NEOSidekick\AiAssistant\Controller\WhoAmIApiController) || within(NEOSidekick\AiAssistant\Controller\GetPreviewApiController)'

roles:
  'Neos.Flow:Everybody':
    privileges:
      - privilegeTarget: NEOSidekick.AiAssistant:AuthorizationRedirect
        permission: GRANT
      - privilegeTarget: NEOSidekick.AiAssistant:PublicPreviewRender
        permission: GRANT
  'Neos.Neos:AbstractEditor':
    privileges:
      - privilegeTarget: NEOSidekick.AiAssistant:CanUse
        permission: GRANT
